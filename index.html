<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Roleta da Rifa Tattoo • Rossi Tattoo (01 a 60)</title>
  <meta name="description" content="Roleta oficial de 60 números para sorteio da Rifa Tattoo. Animação fluida para celular e computador, efeitos sonoros e gerador de stories para Instagram.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,900&family=Permanent+Marker&family=Rock+Salt&display=swap" rel="stylesheet">

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Atmospheres -->
  <div class="bg-layer"></div>
  <div class="bg-overlay"></div>
  <canvas id="fx-canvas"></canvas>

  <div class="app-container">
    
    <!-- Top Action Bar -->
    <header class="top-bar">
      <div class="brand-badge">
        <span>👑</span> ROSSI.TATTOO
      </div>
      <div class="top-controls">
        <button id="btnSoundToggle" class="icon-btn" title="Ativar/Desativar Som" aria-label="Som">🔊</button>
        <button id="btnFullscreen" class="icon-btn" title="Modo Tela Cheia" aria-label="Tela Cheia">⛶</button>
      </div>
    </header>

    <!-- Flyer Branding Header -->
    <div class="flyer-header">
      <p class="sub-banner">Você escolhe a Tattoo!</p>
      
      <div class="title-wrap">
        <span class="crown-decor">👑</span>
        <h1 class="main-title">RIFA TATTOO</h1>
        <span class="crown-decor">👑</span>
      </div>

      <div class="raffle-specs">
        <span class="spec-badge numbers">60 NÚMEROS</span>
      </div>

      <p class="prize-tag">
        <span>✦</span> PRÊMIO: 1 TATTOO DA SUA ESCOLHA <span>✦</span>
      </p>
    </div>

    <!-- Main Roulette Stage -->
    <main class="roulette-stage">
      
      <!-- Live HUD indicator -->
      <div class="live-hud" id="liveHud">
        <span class="hud-label">APONTANDO:</span>
        <div class="hud-number" id="hudNumber">--</div>
      </div>

      <!-- Wheel Canvas Wrapper -->
      <div class="wheel-wrapper">
        <canvas id="rouletteCanvas"></canvas>
      </div>

      <!-- Spin Controls -->
      <div class="spin-actions">
        <button id="btnSpin" class="btn-spin" type="button">
          <span>👑 GIRAR ROLETA 👑</span>
        </button>
      </div>

    </main>

    <!-- Footer -->
    <footer class="studio-footer">
      <div class="footer-steps">
        <span>Sorte</span>
        <span>•</span>
        <span>Arte</span>
        <span>•</span>
        <span>Tattoo Nova</span>
      </div>
      <div class="artist-signature">
        <span>👑</span> Rossi.tattoo <span>👑</span>
      </div>
    </footer>

  </div>

  <!-- MODAL: Winner Celebration -->
  <div class="modal-overlay" id="winnerModal">
    <div class="modal-box winner-modal-box">
      <button class="modal-close" id="winnerCloseBtn" aria-label="Fechar">&times;</button>
      
      <div class="winner-crown">👑</div>
      <div class="winner-subtitle">TEMOS UM VENCEDOR!</div>
      <h2 class="winner-title">NÚMERO SORTEADO</h2>

      <div class="winner-badge-giant">
        <span class="big-num" id="winnerBigNum">00</span>
      </div>

      <div class="winner-details">
        <div class="winner-prize-banner">PRÊMIO: 1 TATTOO DA SUA ESCOLHA!</div>
        <div class="winner-meta">Sorteio Oficial • Rossi Tattoo</div>
      </div>

      <div class="winner-actions">
        <button id="btnDownloadStory" class="btn-download-story" type="button">
          <span>📸</span> BAIXAR STORY PRO INSTAGRAM (9:16)
        </button>
        <button id="btnNewSpin" class="btn-primary" type="button">
          GIRAR NOVAMENTE
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="audio.js"></script>
  <script src="wheel.js"></script>
  <script src="script.js"></script>
</body>
</html>
